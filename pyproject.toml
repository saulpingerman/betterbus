[project]
name = "betterbus"
version = "0.1.0"
description = "Causal evaluation of the WMATA Better Bus Network Redesign from public data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gtfs-realtime-bindings>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["W191"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["network: needs internet access and API keys"]
