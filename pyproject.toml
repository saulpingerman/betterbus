[project]
name = "betterbus"
version = "0.1.0"
description = "Causal evaluation of the WMATA Better Bus Network Redesign from public data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "gtfs-realtime-bindings>=1.0",
    "h3>=4.5.0",
    "linearmodels>=7.1",
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "pyarrow>=17",
    "pymupdf>=2.1",
    "pyogrio>=0.13.0",
    "python-dotenv>=1.0",
    "r5py>=1.1.7",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "statsmodels>=0.15.0",
    "zstandard>=0.23",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["W191"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["network: needs internet access and API keys"]
